name: Release Package

on:
  release:
    types: [published]

# Upload the release asset, and push the package to main.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        run: |
          version="${TAG#v}"
          plg_version=$(sed -n 's/^ *<!ENTITY version *"\([^"]*\)">$/\1/p' ACME.plg)
          if [ "$plg_version" != "$version" ]; then
            echo "::error::ACME.plg version '$plg_version' does not match release '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=ACME-$version-noarch-1.txz" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace -e VERSION \
            aclemons/slackware:15.0 ./scripts/build_package.sh

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "archive/$PACKAGE"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-repo

      - name: Add package to main, and update md5 in ACME.plg
        working-directory: main-repo
        run: |
          plg_version=$(sed -n 's/^ *<!ENTITY version *"\([^"]*\)">$/\1/p' ACME.plg)
          if [ "$plg_version" != "$VERSION" ]; then
            echo "::error::ACME.plg version on main '$plg_version' does not match release '$VERSION'. Add archive/$PACKAGE and its md5 manually."
            exit 1
          fi
          md5=$(md5sum "../archive/$PACKAGE" | cut -d ' ' -f 1)
          echo "MD5: $md5"
          mkdir -p archive
          cp "../archive/$PACKAGE" archive/
          sed -i "s/^\( *<!ENTITY md5 *\"\)[0-9a-f]*\(\">\)$/\1$md5\2/" ACME.plg
          grep -q "<!ENTITY md5 *\"$md5\">" ACME.plg || { echo "::error::Failed to update md5 in ACME.plg"; exit 1; }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "archive/$PACKAGE" ACME.plg
          git commit -m "Added binary for version $VERSION"
          git push
